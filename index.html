<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">
    <title>Frontend Mentor | Base Apparel coming soon page</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Josefin+Sans:wght@300;400;600&display=swap" rel="stylesheet">
</head>
<body>

    <main class="container">
        <section class="content-side">
            <header>
                <img src="./images/logo.svg" alt="logo" class="logo">
            </header>

            <h1><span>We're</span> coming soon</h1>
            <p>Hello fellow shoppers! We're currently building our new fashion store. Add your email below to stay up-to-date with announcements and our launch deals.</p>

            <form id="email-form" novalidate>
                <div class="input-group">
                    <input type="email" id="email" placeholder="Email Address" required>
                    <img src="./images/icon-error.svg" alt="error" class="error-icon">
                    <button type="submit" id="submit-btn">
                        <img src="./images/icon-arrow.svg" alt="Submit">
                    </button>
                </div>
                <span class="error-message">Please provide a valid email</span>
            </form>
        </section>

        <section class="image-side">
            <picture>
                <source srcset="./images/hero-desktop.jpg" media="(min-width: 800px)">
                <img src="./images/hero-mobile.jpg" alt="Fashion model">
            </picture>
        </section>
    </main>

    <footer class="attribution">
        <p>Challenge by <a href="https://www.frontendmentor.io?ref=challenge" target="_blank">Frontend Mentor</a>. 
        Coded by <a href="#">Fatima</a>.</p>
    </footer>
    <script src="script.js"></script>

</body>
</html>
